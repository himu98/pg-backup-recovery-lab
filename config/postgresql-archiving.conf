# Add to the end of /var/lib/pgsql/data/postgresql.conf, then: sudo systemctl restart postgresql
# (archive_mode needs a restart; a reload is not enough. Lab 03 explains why.)

wal_level = replica
archive_mode = on

# %p = path of the WAL file to archive, %f = its file name.
# "test ! -f" refuses to overwrite a file that is already archived. If the command exits non-zero,
# PostgreSQL keeps the WAL file and retries, so a failing archive slowly fills the disk. Watch for it.
archive_command = 'test ! -f /var/lib/pgsql/wal_archive/%f && cp %p /var/lib/pgsql/wal_archive/%f'

# Force a WAL switch at least every 5 minutes, so a quiet database still archives.
# This is your worst-case data loss window (RPO) when the server dies completely.
archive_timeout = 300
